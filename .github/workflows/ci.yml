name: CI

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main, develop, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  FORCE_COLOR: '1'

jobs:
  workflow-checks:
    name: Workflow policy and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r .github/requirements-ci.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: ruff check scripts && ruff format --check scripts
      - name: Validate GitHub Actions workflows
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      has_frontend: ${{ steps.components.outputs.frontend }}
      has_backend: ${{ steps.components.outputs.backend }}
      has_docker: ${{ steps.components.outputs.docker }}
      has_javascript: ${{ steps.components.outputs.javascript }}
      has_python: ${{ steps.components.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/**'
            backend:
              - 'backend/**'
              - '.github/**'
            docker:
              - '**/Dockerfile*'
              - '**/docker-compose*.yml'
              - '**/docker-compose*.yaml'
              - '**/.dockerignore'
              - '.dockerignore'
              - '.github/**'

      - name: Detect available components
        id: components
        shell: bash
        run: |
          for file in frontend/package.json frontend/package-lock.json \
            backend/requirements.txt backend/pyproject.toml \
            frontend/Dockerfile backend/Dockerfile docker-compose.yml; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required project file is missing: $file"
              exit 1
            fi
          done
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"

          if git ls-files -- '*.js' '*.jsx' '*.ts' '*.tsx' | grep . > /dev/null; then
            echo "javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "javascript=false" >> "$GITHUB_OUTPUT"
            echo "JavaScript/TypeScript CodeQL will be skipped: no source files are present."
          fi

          if git ls-files -- '*.py' | grep . > /dev/null; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "Python CodeQL will be skipped: no source files are present."
          fi

  frontend:
    name: Frontend · React + TS + Recharts
    needs: changes
    if: >-
      needs.changes.outputs.has_frontend == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: TypeScript project typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build check
        run: npm run build

      - name: Upload coverage (Codecov)
        if: always() && hashFiles('frontend/coverage/**') != ''
        uses: codecov/codecov-action@v7
        with:
          flags: frontend
          directory: frontend/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Keep frontend coverage report
        if: always() && hashFiles('frontend/coverage/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            frontend/dist
            frontend/build
          if-no-files-found: error
          retention-days: 5

  backend-lint:
    name: Backend · Ruff, Mypy, Migrations, Security
    needs: changes
    if: >-
      needs.changes.outputs.has_backend == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || 'config.settings' }}
      SECRET_KEY: 'ci-only-in-memory-secret-key-at-least-50-characters-long-12345'
      JWT_SIGNING_KEY: 'ci-only-jwt-signing-key-at-least-32-chars-long'
      DEBUG: 'False'
      DATABASE_URL: sqlite:///ci-lint.sqlite3
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: 'True'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install dependencies + linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Bandit SAST (Python security check)
        run: bandit -r config projects -x projects/tests.py,projects/migrations -ll -ii

      - name: Mypy typecheck
        run: mypy .

      - name: Check for missing Django migrations
        run: python manage.py makemigrations --check --dry-run --noinput

  backend-test:
    name: Backend · Django, DRF, Celery, Beat, WeasyPrint, Postgres, Redis
    needs: changes
    if: >-
      needs.changes.outputs.has_backend == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || 'config.settings' }}
      SECRET_KEY: 'ci-only-in-memory-secret-key-at-least-50-characters-long-12345'
      JWT_SIGNING_KEY: 'ci-only-jwt-signing-key-at-least-32-chars-long'
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      DB_NAME: app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: 'True'
      CELERY_TASK_EAGER_PROPAGATES: 'True'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libharfbuzz0b libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations & Django system check
        run: |
          python manage.py migrate --noinput
          python manage.py check

      - name: Verify WeasyPrint PDF rendering (Full smoke test)
        run: |
          python -c "
          import weasyprint
          pdf = weasyprint.HTML(string='<h1>CI WeasyPrint Smoke Test</h1><p>Render OK</p>').write_pdf()
          assert pdf.startswith(b'%PDF'), 'WeasyPrint failed to generate valid PDF bytes'
          print(f'WeasyPrint {weasyprint.__version__} generated {len(pdf)} bytes successfully.')
          "

      - name: Verify Celery & Celery Beat configuration
        run: |
          python -c "
          import os, django
          django.setup()
          from celery import current_app
          current_app.loader.import_default_modules()
          tasks = [t for t in current_app.tasks.keys() if not t.startswith('celery.')]
          beat_schedule = getattr(current_app.conf, 'beat_schedule', {}) or {}
          print(f'Discovered {len(tasks)} custom Celery tasks and {len(beat_schedule)} Beat schedules.')
          "

      - name: Run tests with coverage
        run: |
          coverage run --source=config,projects manage.py test --noinput
          coverage xml
          coverage report

      - name: Upload coverage (Codecov)
        if: always() && hashFiles('backend/coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          flags: backend
          files: backend/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Keep backend coverage report
        if: always() && hashFiles('backend/coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  security:
    name: Security · Gitleaks, Dependency Audit, CodeQL
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (Gitleaks)
        if: matrix.language == 'python'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit (pip-audit)
        if: matrix.language == 'python' && hashFiles('backend/requirements.txt') != ''
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt

      - name: Frontend dependency audit (npm audit)
        if: matrix.language == 'javascript-typescript' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: github/codeql-action/init@v4
        if: >-
          (matrix.language == 'javascript-typescript' && needs.changes.outputs.has_javascript == 'true') ||
          (matrix.language == 'python' && needs.changes.outputs.has_python == 'true')
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        if: >-
          (matrix.language == 'javascript-typescript' && needs.changes.outputs.has_javascript == 'true') ||
          (matrix.language == 'python' && needs.changes.outputs.has_python == 'true')
        with:
          category: /language:${{ matrix.language }}

  docker:
    name: Docker · Hadolint + Build + Trivy Scan
    needs: changes
    if: >-
      needs.changes.outputs.has_docker == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' ||
       needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check if Dockerfile exists
        id: has
        run: echo "ok=$([[ -f ${{ matrix.component }}/Dockerfile ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: hadolint/hadolint-action@v3.5.0
        if: steps.has.outputs.ok == 'true'
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: error

      - uses: docker/setup-buildx-action@v4
        if: steps.has.outputs.ok == 'true'

      - uses: docker/build-push-action@v7
        if: steps.has.outputs.ok == 'true'
        with:
          context: ${{ matrix.component }}
          push: false
          load: true
          tags: ci/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy container vulnerability scan
        if: steps.has.outputs.ok == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci/${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Validate docker-compose config
        if: matrix.component == 'backend'
        run: |
          docker compose -f docker-compose.yml config -q

  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, workflow-checks, frontend, backend-lint, backend-test, security, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream jobs succeeded or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            .changes.result == "success" and
            .["workflow-checks"].result == "success" and
            .security.result == "success" and
            (to_entries | all(.value.result == "success" or .value.result == "skipped"))'
