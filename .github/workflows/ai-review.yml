name: Gemini PR Review & Conflict Resolver

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ai-review:
    name: AI Code Review (Gemini)
    if: >-
      github.event_name == 'pull_request_target' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Check out trusted automation from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Review the exact PR revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -f scripts/ai_review.py ]]; then
            python -m scripts.ai_review
          else
            echo "Automation is not installed on the base branch yet; manual review is required."
          fi

  ai-resolve-conflicts:
    name: AI Conflict Resolver
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '@ai-bot resolve conflicts' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    concurrency:
      group: ai-resolve-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate request and fetch PR metadata
        id: pr
        working-directory: automation
        run: python -m scripts.resolve_conflicts prepare
      - name: Check out the validated PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pull-request
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve conflicts using trusted automation
        working-directory: automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: python -m scripts.resolve_conflicts resolve "$GITHUB_WORKSPACE/pull-request"
