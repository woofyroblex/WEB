name: Gemini PR Review & Conflict Resolver

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ai-bot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB 1: Automatic AI Code Review (Gemini)
  # ===========================================================================
  ai-review:
    name: AI Code Review (Gemini)
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini AI Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, json, urllib.request

          pr_num = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()

          # 1. Get PR diff (excluding lockfiles & migrations noise)
          diff_cmd = [
              "git", "diff", f"origin/{base_ref}...HEAD", "--",
              ".", ":(exclude)*package-lock.json", ":(exclude)*yarn.lock",
              ":(exclude)*.min.js", ":(exclude)*.svg"
          ]
          diff = subprocess.check_output(diff_cmd, text=True, errors="replace")
          if not diff.strip():
              print("No code changes to review.")
              exit(0)

          max_chars = 45000
          truncated_diff = diff[:max_chars] + ("\n\n...[DIFF TRUNCATED]..." if len(diff) > max_chars else "")

          system_prompt = """You are a Principal Full-Stack Engineer reviewing a Pull Request for this stack:
          - Frontend: React + TypeScript, Recharts
          - Backend: Django + Django REST Framework (DRF), PostgreSQL
          - Async/Jobs: Celery + Redis + Celery Beat
          - Auth & PDF: JWT (SimpleJWT) + WeasyPrint
          - DevOps: Docker + GitHub Actions

          Review the diff for high-confidence issues only:
          1. Security: JWT token leakage/validation, missing DRF permission_classes, SQL injection/raw queries, XSS, hardcoded secrets.
          2. Backend & DB: N+1 queries (missing select_related/prefetch_related), missing Django migrations, non-atomic DB transactions.
          3. Celery & Beat: Non-idempotent tasks, passing ORM objects instead of IDs to .delay(), missing retry/time_limit settings.
          4. WeasyPrint: Unbounded PDF memory usage, SSRF via external URL fetching in HTML templates, unclosed file handles.
          5. Frontend (React/TS/Recharts): Hook dependency bugs, `any` types, missing ResponsiveContainer dimensions in Recharts, memory leaks.

          Format your output cleanly in Markdown:
          - Start with a brief **PR Summary & Risk Level (Low / Medium / High)**.
          - List actionable findings with `File:Line` references and concrete code fixes.
          - If everything looks solid, state that clearly in 2 sentences."""

          user_prompt = f"Review this PR diff:\n\n```diff\n{truncated_diff}\n```"

          def call_gemini():
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
              payload = {
                  "systemInstruction": {"parts": [{"text": system_prompt}]},
                  "contents": [{"parts": [{"text": user_prompt}]}],
                  "generationConfig": {
                      "thinkingConfig": {"thinkingLevel": "low"}
                  }
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": gemini_key
                  }
              )
              with urllib.request.urlopen(req, timeout=180) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  return "Google Gemini Flash", data["candidates"][0]["content"]["parts"][0]["text"]

          reviews = []
          # Run Gemini when the repository secret is configured.
          if gemini_key:
              try:
                  reviews.append(call_gemini())
              except Exception as e:
                  print(f"Gemini error: {e}")
          else:
              print("GEMINI_API_KEY is not configured.")

          if not reviews:
              print("::warning::Gemini did not return a review. The AI review is optional; continuing with the remaining checks.")
              exit(0)

          body_parts = ["## 🤖 Automated AI Code Review\n"]
          for provider, content in reviews:
              body_parts.append(f"### 🧠 Reviewed by {provider}\n\n{content}\n")
          body_parts.append("\n---\n*💡 Tip: If this PR has merge conflicts, comment `@ai-bot resolve conflicts` to auto-resolve them!*")

          final_body = "\n".join(body_parts)
          with open("/tmp/review.md", "w") as f:
              f.write(final_body)

          subprocess.run(["gh", "pr", "comment", pr_num, "--body-file", "/tmp/review.md"], check=True)
          EOF

      - name: Check for Merge Conflicts & Notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort || true
            gh pr comment "$PR_NUMBER" --body "⚠️ **Merge Conflict Detected** with \`$BASE_REF\` in:
          \`\`\`
          $CONFLICTS
          \`\`\`
          Reply with **\`@ai-bot resolve conflicts\`** on this PR and I will automatically merge \`$BASE_REF\` and resolve the conflicts for you."
          else
            git merge --abort 2>/dev/null || true
          fi

  # ===========================================================================
  # JOB 2: AI Merge Conflict Resolver (Triggered by "@ai-bot resolve conflicts")
  # ===========================================================================
  ai-resolve-conflicts:
    name: AI Conflict Resolver
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@ai-bot') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: React to comment with eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content="eyes"

      - name: Fetch PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --json headRefName,baseRefName,headRepositoryOwner)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          BASE_REF=$(echo "$PR_JSON" | jq -r .baseRefName)
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge base branch & resolve conflicts with Gemini
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF" "$HEAD_REF"

          if git merge --no-edit "origin/$BASE_REF"; then
            git push origin "HEAD:$HEAD_REF"
            gh pr comment "$PR_NUMBER" --body "✅ Merged \`$BASE_REF\` into \`$HEAD_REF\` cleanly with no conflicts!"
            exit 0
          fi

          CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
          echo "Conflicting files:"
          echo "$CONFLICT_FILES"

          python3 - << 'EOF'
          import os, subprocess, json, urllib.request

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          pr_num = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]
          head_ref = os.environ["HEAD_REF"]

          files = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          resolved_files = []
          failed_files = []

          for filepath in files:
              if filepath.endswith(("package-lock.json", "yarn.lock")):
                  # Lockfiles: accept base and regenerate later if needed
                  subprocess.run(["git", "checkout", "--theirs", filepath], check=False)
                  subprocess.run(["git", "add", filepath], check=False)
                  resolved_files.append(f"{filepath} (lockfile auto-merged)")
                  continue

              with open(filepath, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()

              if len(content) > 60000:
                  failed_files.append(f"{filepath} (file too large for safe AI resolution)")
                  continue

              prompt = f"""Resolve the Git merge conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`) in the file `{filepath}` from a React+TypeScript / Django+DRF+Celery repository.
          Preserve both sides' features, imports, types, and logic cleanly without syntax errors.
          Return ONLY the complete resolved file content with NO markdown code fences (` ``` `) and NO explanations.

          FILE CONTENT WITH CONFLICTS:
          {content}"""

              resolved_text = None
              if gemini_key:
                  try:
                      url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
                      payload = {
                          "systemInstruction": {"parts": [{"text": "Return only the complete resolved file content, with no markdown fences or explanation."}]},
                          "contents": [{"parts": [{"text": prompt}]}],
                          "generationConfig": {
                              "thinkingConfig": {"thinkingLevel": "low"}
                          }
                      }
                      req = urllib.request.Request(
                          url,
                          data=json.dumps(payload).encode("utf-8"),
                          headers={
                              "Content-Type": "application/json",
                              "x-goog-api-key": gemini_key
                          }
                      )
                      with urllib.request.urlopen(req, timeout=180) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          resolved_text = data["candidates"][0]["content"]["parts"][0]["text"]
                  except Exception as e:
                      print(f"Gemini failed on {filepath}: {e}")
              else:
                  print("GEMINI_API_KEY is not configured; cannot resolve conflicts with Gemini.")

              if resolved_text:
                  # Strip accidental markdown code fences if the LLM added them
                  lines = resolved_text.splitlines()
                  if lines and lines[0].startswith("```"):
                      lines = lines[1:]
                  if lines and lines[-1].startswith("```"):
                      lines = lines[:-1]
                  cleaned = "\n".join(lines) + "\n"

                  if "<<<<<<<" not in cleaned and ">>>>>>>" not in cleaned:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(cleaned)
                      subprocess.run(["git", "add", filepath], check=True)
                      resolved_files.append(filepath)
                  else:
                      failed_files.append(f"{filepath} (markers still present)")
              else:
                  failed_files.append(filepath)

          if failed_files:
              subprocess.run(["git", "merge", "--abort"], check=False)
              msg = "❌ **AI Conflict Resolution Aborted**\nCould not safely auto-resolve:\n" + "\n".join(f"- `{x}`" for x in failed_files)
              subprocess.run(["gh", "pr", "comment", pr_num, "--body", msg], check=True)
              exit(1)

          subprocess.run(["git", "commit", "-m", f"chore: AI-resolved merge conflicts with {base_ref}"], check=True)
          subprocess.run(["git", "push", "origin", f"HEAD:{head_ref}"], check=True)

          msg = "✅ **Merge Conflicts Resolved by AI!**\nMerged `" + base_ref + "` into `" + head_ref + "` and resolved:\n" + "\n".join(f"- `{x}`" for x in resolved_files)
          subprocess.run(["gh", "pr", "comment", pr_num, "--body", msg], check=True)
          EOF
