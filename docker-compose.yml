services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projecthub}
      POSTGRES_USER: ${POSTGRES_USER:-projecthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projecthub}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projecthub} -d ${POSTGRES_DB:-projecthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-jwt-signing-key-change-before-deploying}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-projecthub}:${POSTGRES_PASSWORD:-projecthub}@db:5432/${POSTGRES_DB:-projecthub}
      CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-jwt-signing-key-change-before-deploying}
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-projecthub}:${POSTGRES_PASSWORD:-projecthub}@db:5432/${POSTGRES_DB:-projecthub}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    restart: unless-stopped

  beat:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-jwt-signing-key-change-before-deploying}
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-projecthub}:${POSTGRES_PASSWORD:-projecthub}@db:5432/${POSTGRES_DB:-projecthub}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
